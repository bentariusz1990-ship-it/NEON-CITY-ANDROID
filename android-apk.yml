name: NEON CITY - Zbuduj APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NEON_CITY_SOURCE.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Rozpakuj kod gry
        run: |
          test -s NEON_CITY_SOURCE.zip
          unzip -o NEON_CITY_SOURCE.zip -d .
          test -s app/src/main/assets/index.html
          cmp index.html app/src/main/assets/index.html
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kompilacja APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Kontrola wyniku
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Udostepnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: NEON_CITY_ANDROID_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
